<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Misión Climática — Contrato 047</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <!-- Fuente global A-Frame - Roboto MSDF -->
    <script src="fuente-aframe.js"></script>

<!-- Estilos propios -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a-scene fuente-global>

        <!-- =====================================================
            BLOQUE: RECURSOS - INTRO

            Contiene los archivos utilizados por la escena
            inicial de Misión Climática.
        ====================================================== -->
        <a-assets>
            <img id="sala-intro" src="assets/360/intro_.png">
        </a-assets>
        <!-- FIN BLOQUE: RECURSOS - INTRO -->


        <!-- =====================================================
            BLOQUE: PANORÁMICA 360 - INTRO

            Imagen de fondo de la sala inicial.
        ====================================================== -->
        <a-sky
            src="#sala-intro"
            rotation="0 -90 0">
        </a-sky>
        <!-- FIN BLOQUE: PANORÁMICA 360 - INTRO -->


        <!-- =====================================================
            BLOQUE: HOTSPOT ORDENADOR - INTRO

            Posición PROVISIONAL.

            El contenedor permite orientar el hotspot.
            La esfera se sitúa a 4 m del centro de la escena.

            IMPORTANTE:
            - El hotspot se muestra inicialmente en rojo.
            - Debe calibrarse sobre la pantalla del ordenador.
            - Una vez calibrado cambiaremos opacity a 0.
        ====================================================== -->
        <a-entity
            id="contenedor-hotspot-ordenador-intro"
            rotation="-2 5 0">

            <a-sphere
                id="hotspot-ordenador-intro"
                position="0 0 -4"
                radius="1.2"
                color="red"
                opacity="0"
                class="interactivo">
            </a-sphere>

        </a-entity>
        <!-- FIN BLOQUE: HOTSPOT ORDENADOR - INTRO -->


        <!-- =====================================================
            BLOQUE: CÁMARA E INTERACCIÓN

            Cámara del operador.

            El cursor permite interactuar únicamente con
            elementos que tengan class="interactivo".
        ====================================================== -->

        <!-- =====================================================
            BLOQUE: CONTROLADORES VR META QUEST
            ===================================================== -->

        <a-entity
            laser-controls="hand: left"
            raycaster="objects: .interactivo">
        </a-entity>

        <a-entity
            laser-controls="hand: right"
            raycaster="objects: .interactivo">
        </a-entity>

        <!-- =====================================================
            FIN BLOQUE: CONTROLADORES VR META QUEST
            ===================================================== -->
        
        <a-camera
            position="0 1.6 0"
            look-controls="enabled: true">

            <a-cursor
                id="cursor-principal"
                raycaster="objects: .interactivo"
                cursor="rayOrigin: mouse">
            </a-cursor>
        </a-camera>

        <!-- FIN BLOQUE: CÁMARA E INTERACCIÓN -->

            <!-- =====================================================
                BLOQUE: VENTANA 1 - AVISO DE CORREO

                Primera ventana de la introducción.

                Informa al operador de que ha recibido
                un correo electrónico de Estrellita.
            ====================================================== -->
            <a-entity
                id="ventana-aviso-correo"
                visible="false"
                position="0 1.6 -3.5">

                <!-- Fondo -->
                <a-plane
                    width="2.5"
                    height="1.45"
                    color="#F2F2F2">
                </a-plane>


                <!-- Título -->
                <a-text
                    value="NUEVO CORREO"
                    color="#111111"
                    align="center"
                    position="0 0.43 0.02"
                    width="1.55">
                </a-text>


                <!-- Mensaje -->
                <a-text
                    value="Tiene un correo electrónico de Estrellita."
                    color="#222222"
                    align="center"
                    position="0 0.08 0.02"
                    width="1.30">
                </a-text>


                <!-- Botón ABRIR CORREO -->
                <a-plane
                    id="boton-abrir-correo"
                    width="1.05"
                    height="0.28"
                    color="#D9D9D9"
                    position="0 -0.42 0.02">

                    <a-text
                        value="ABRIR CORREO"
                        color="#111111"
                        align="center"
                        anchor="center"
                        position="0 0 0.01"
                    width="0.90">
                    </a-text>

                </a-plane>


                <!-- Botón X -->
                <a-plane
                    id="cerrar-aviso-correo"
                    width="0.22"
                    height="0.22"
                    color="#D9D9D9"
                    position="1.05 0.55 0.02">

                    <a-text
                        value="X"
                        color="#111111"
                        align="center"
                        anchor="center"
                        position="0 0 0.01"
                    width="0.70">
                    </a-text>

                </a-plane>

            </a-entity>
            <!-- FIN BLOQUE: VENTANA 1 - AVISO DE CORREO -->


            <!-- =====================================================
                BLOQUE: VENTANA 2 - CORREO DE ESTRELLITA
            ====================================================== -->
            <a-entity
                id="ventana-correo-estrellita"
                visible="false"
                position="0 1.6 -3.5">

                <!-- Fondo -->
                <a-plane
                    width="3.75"
                    height="2.45"
                    color="#F2F2F2">
                </a-plane>

                <!-- Remitente -->
                <a-text
                    value="DE: ESTRELLITA"
                    color="#111111"
                    align="left"
                    anchor="left"
                    position="-1.62 1.00 0.02"
                    width="1.55">
                </a-text>

                <!-- Asunto -->
                <a-text
                    value="ASUNTO: NUEVO PROYECTO"
                    color="#333333"
                    align="left"
                    anchor="left"
                    position="-1.62 0.82 0.02"
                    width="1.25">
                </a-text>

                <!-- =================================================
                    PÁRRAFO 1
                ================================================== -->
                <a-text
                    value="Hola, soy Estrellita, gerente y propietaria de la empresa Little Star, pionera en tecnología ambiental."
                    color="#222222"
                    align="left"
                    anchor="left"
                    position="-1.62 0.59 0.02"
                    width="3.15"
                    wrap-count="62">
                </a-text>

                <!-- =================================================
                    PÁRRAFO 2
                ================================================== -->
                <a-text
                    value="Estamos avanzando en el desarrollo de dispositivos y herramientas que ayuden a la sociedad y protejan el medioambiente: desde motores impulsados con residuos hasta árboles sintéticos que permitan mantener activas las zonas en reforestación."
                    color="#222222"
                    align="left"
                    anchor="left"
                    position="-1.62 0.30 0.02"
                    width="3.15"
                    wrap-count="62">
                </a-text>

                <!-- =================================================
                    PÁRRAFO 3
                ================================================== -->
                <a-text
                    value="Actualmente tengo un nuevo proyecto en marcha. Mi buen amigo El Pequeño Tut Tut, pequeño de nombre pero grande de corazón, iba a echarme una mano con el análisis de algo que se conoce como Triple Balance pero, desgraciadamente, por causas de fuerza mayor, se encuentra ausente."
                    color="#222222"
                    align="left"
                    anchor="left"
                    position="-1.62 -0.09 0.02"
                    width="3.15"
                    wrap-count="62">
                </a-text>

                <!-- =================================================
                    PÁRRAFO 4
                ================================================== -->
                <a-text
                    value="Afortunadamente, me dijo que conocía a las personas adecuadas para este proyecto... vuestro grupo."
                    color="#222222"
                    align="left"
                    anchor="left"
                    position="-1.62 -0.56 0.02"
                    width="3.15"
                    wrap-count="62">
                </a-text>

                <!-- =================================================
                    PÁRRAFO 5
                ================================================== -->
                <a-text
                    value="Espero que podáis ayudarme. Os paso toda la información al respecto."
                    color="#222222"
                    align="left"
                    anchor="left"
                    position="-1.62 -0.79 0.02"
                    width="3.15"
                    wrap-count="62">
                </a-text>

                <!-- Botón INSTRUCCIONES -->
                <a-plane
                    id="boton-instrucciones"
                    width="1.25"
                    height="0.27"
                    color="#D9D9D9"
                    position="0 -1.06 0.02">

                    <a-text
                        value="INSTRUCCIONES"
                        color="#111111"
                        align="center"
                        anchor="center"
                        position="0 0 0.01"
                        width="1.10">
                    </a-text>

                </a-plane>

            </a-entity>
            <!-- FIN BLOQUE: VENTANA 2 - CORREO DE ESTRELLITA -->

            <!-- =====================================================
                BLOQUE: VENTANA 3 - INSTRUCCIONES
            ====================================================== -->
            <a-entity
                id="ventana-instrucciones"
                visible="false"
                position="0 1.6 -3.5">

                <!-- Fondo -->
                <a-plane
                    width="3.75"
                    height="2.45"
                    color="#F2F2F2">
                </a-plane>

                <!-- Título -->
                <a-text
                    value="INSTRUCCIONES"
                    color="#111111"
                    align="center"
                    anchor="center"
                    position="0 1.00 0.02"
                    width="1.75">
                </a-text>

                <!-- =================================================
                    INSTRUCCIÓN 1
                ================================================== -->
                <a-text
                    value="Vais a construir una empresa de economía social basada en el Triple Balance."
                    color="#222222"
                    align="left"
                    anchor="left"
                    position="-1.62 0.70 0.02"
                    width="3.15"
                    wrap-count="62">
                </a-text>

                <!-- =================================================
                    INSTRUCCIÓN 2
                ================================================== -->
                <a-text
                    value="La experiencia se desarrollará a lo largo de 4 salas o módulos."
                    color="#222222"
                    align="left"
                    anchor="left"
                    position="-1.62 0.42 0.02"
                    width="3.15"
                    wrap-count="62">
                </a-text>

                <!-- =================================================
                    INSTRUCCIÓN 3
                ================================================== -->
                <a-text
                    value="Cada uno de vosotros dispondrá de un sobre con parte de la información y, entre todos, tendréis que reconstruirla para llevar a cabo la iniciativa empresarial."
                    color="#222222"
                    align="left"
                    anchor="left"
                    position="-1.62 0.14 0.02"
                    width="3.15"
                    wrap-count="62">
                </a-text>

                <!-- =================================================
                    INSTRUCCIÓN 4
                ================================================== -->
                <a-text
                    value="No hay respuestas correctas ni incorrectas, solo empresas diferentes."
                    color="#222222"
                    align="left"
                    anchor="left"
                    position="-1.62 -0.20 0.02"
                    width="3.15"
                    wrap-count="62">
                </a-text>

                <!-- =================================================
                    INSTRUCCIÓN 5
                ================================================== -->
                <a-text
                    value="Existirán una serie de restricciones que iréis descubriendo a lo largo de cada sala y a las que tendréis que adaptaros para poder cumplir con el Contrato 047."
                    color="#222222"
                    align="left"
                    anchor="left"
                    position="-1.62 -0.48 0.02"
                    width="3.15"
                    wrap-count="62">
                </a-text>

                <!-- =================================================
                    MENSAJE FINAL
                ================================================== -->
                <a-text
                    value="Buena suerte."
                    color="#222222"
                    align="center"
                    anchor="center"
                    position="0 -0.78 0.02"
                    width="1.35">
                </a-text>

                <!-- Botón COMENZAR -->
                <a-plane
                    id="boton-comenzar"
                    width="1.25"
                    height="0.27"
                    color="#D9D9D9"
                    position="0 -1.06 0.02">

                    <a-text
                        value="COMENZAR"
                        color="#111111"
                        align="center"
                        anchor="center"
                        position="0 0 0.01"
                        width="1.05">
                    </a-text>

                </a-plane>

            </a-entity>
            <!-- FIN BLOQUE: VENTANA 3 - INSTRUCCIONES -->


        


    </a-scene>


    <!-- =====================================================
        BLOQUE: INTERFAZ INTRO
        Capa visual e interactiva de la introducción.
    ====================================================== -->
    <script src="interfaz_intro.js"></script>
    <!-- FIN BLOQUE: INTERFAZ INTRO -->


</body>

</html>
