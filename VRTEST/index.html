<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VR Video Test</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>
<a-scene>

  <a-assets>
    <video
      id="videoTV"
      src="MKT_47_Intro.mp4"
      preload="auto"
      autoplay
      loop
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-sky src="panoramica.jpg" rotation="0 -90 0"></a-sky>

  <!-- Pantalla de vídeo delante del usuario -->
 <a-video
    id="pantallaVideo"
    src="#videoTV"
    position="0 1.8 -3"
    width="4"
    height="2.25"
    visible="true">
  </a-video>

 
  

</a-scene>

<script>

</script>

</body>
</html>
