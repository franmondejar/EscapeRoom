<div id="visorImagen" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
z-index:9999;
text-align:center;
">

<img id="imagenCarrusel"
src="assets/foto.jpg"
style="
max-width:90%;
max-height:90%;
margin-top:2%;
">

<br>

<br><br>

<button onclick="anteriorImagen()">
← Anterior
</button>

<button onclick="siguienteImagen()">
Siguiente →
</button>

<button onclick="cerrarImagen()">
Cerrar
</button>

</div>

<script>

var imagenes = [
    "assets/foto.jpg",
    "assets/foto2.png"
];

var indiceActual = 0;

function abrirImagen() {

    indiceActual = 0;

    document.getElementById("imagenCarrusel").src =
        imagenes[indiceActual];

    document.getElementById("visorImagen").style.display = "block";
}

function cerrarImagen() {
    document.getElementById("visorImagen").style.display = "none";
}

function siguienteImagen() {

    indiceActual++;

    if (indiceActual >= imagenes.length) {
        indiceActual = 0;
    }

    document.getElementById("imagenCarrusel").src =
        imagenes[indiceActual];
}

function anteriorImagen() {

    indiceActual--;

    if (indiceActual < 0) {
        indiceActual = imagenes.length - 1;
    }

    document.getElementById("imagenCarrusel").src =
        imagenes[indiceActual];
}

function abrirVideo() {

    document.getElementById("visorVideo").style.display = "block";

    document.getElementById("videoEscape").play();
}

function cerrarVideo() {

    document.getElementById("videoEscape").pause();

    document.getElementById("videoEscape").currentTime = 0;

    document.getElementById("visorVideo").style.display = "none";
}

</script>

<div id="visorVideo" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
z-index:9999;
text-align:center;
">

<video id="videoEscape"
controls
autoplay
style="
max-width:90%;
max-height:85%;
margin-top:2%;
">

<source src="assets/MKT_47_Intro.mp4" type="video/mp4">

</video>

<br>

<button onclick="cerrarVideo()">
Cerrar
</button>

</div>
